services:
  # ─── Backend (Node.js — no Docker) ──────────────────────────────────────────
  - type: web
    name: smart-restro-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5002
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
    healthCheckPath: /test

  # ─── Frontend (React Static Site — no Docker) ────────────────────────────────
  - type: web
    name: smart-restro-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: DISABLE_ESLINT_PLUGIN
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
