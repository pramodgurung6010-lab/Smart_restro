services:
  # ─── Backend — Docker image from Docker Hub ──────────────────────────────
  - type: web
    name: smart-restro-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5002
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
    healthCheckPath: /test

  # ─── Frontend — Static Site (React build) ────────────────────────────────
  - type: web
    name: smart-restro-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: DISABLE_ESLINT_PLUGIN
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
