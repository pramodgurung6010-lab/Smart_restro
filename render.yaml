services:
  # ─── Frontend (React Static Site) — FREE on Render ─────────────────────────
  - type: web
    name: smart-restro-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false          # paste your Railway backend URL here
      - key: DISABLE_ESLINT_PLUGIN
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
