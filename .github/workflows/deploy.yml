name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-backend:
    name: Check Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm install
        working-directory: ./backend
      - run: node -e "console.log('Backend OK')"
        working-directory: ./backend

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
        working-directory: ./frontend
      - run: npm run build
        working-directory: ./frontend
        env:
          REACT_APP_API_URL: https://placeholder.onrender.com/api
          DISABLE_ESLINT_PLUGIN: "true"
          CI: "false"
